[project]
name = "context-aware-prompt-manager"
version = "0.2.0"
description = "Biblioteca local de prompts con contexto visible, búsqueda y versionado opcional."
authors = [
    { name = "Robert Salinas" }
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.9.0",
    "gitpython>=3.1.30",
    "jinja2>=3.1.2",
    "pyyaml>=6.0.1",
    "rich>=13.5.2",
    "pydantic>=2.0.0",
    "customtkinter>=5.2.0",
]
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
prompt-mgr = "prompt_mgr.cli:app"
prompt-mgr-gui = "prompt_mgr.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "black", "flake8", "mypy", "types-PyYAML", "build", "pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/prompt_mgr"]
omit = ["src/prompt_mgr/gui.py"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.black]
target-version = ["py311"]
